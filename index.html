async function exportBackup() {
  const payload = {
    app: 'bsync', backupVersion: 1,
    exportedAt: new Date().toISOString(),
    data,
  };
  const json = JSON.stringify(payload, null, 2);
  const filename = `bsync-backup-${ymdKey(new Date())}.json`;
  // Try the Artifact downloads capability first (works in the Claude viewer)
  try {
    const downloads = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (downloads) {
      await downloads.save({ filename, data: json });
      toast('Backup baixado');
      return;
    }
  } catch (e) {
    console.warn('downloads capability failed, falling back', e);
  }
  // Fallback for standalone / Vercel usage
  try {
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    toast('Backup baixado');
  } catch (e) {
    // Last-resort fallback: show the JSON in a modal so the user can copy it
    openModal('Backup (copie o conteúdo)', `
      <textarea readonly rows="12" style="font-family:var(--font-mono);font-size:11px">${escapeHtml(json)}</textarea>
      <button class="btn btn-primary" id="copyBk">Copiar</button>
    `, '<button class="btn" data-close>Fechar</button>');
    document.getElementById('copyBk').onclick = () => {
      navigator.clipboard?.writeText(json).then(() => toast('Copiado'));
    };
  }
}

async function restoreBackupText(text) {
  try {
    const stripped = String(text).replace(/^﻿/, '');
    const obj = JSON.parse(stripped);
    const d = obj.data || obj;
    const counts = {
      tx: (d.transactions||[]).length,
      tasks: (d.tasks||[]).length,
      env: (d.envelopes||[]).length,
      fix: (d.fixedItems||[]).length,
      cards: (d.cards||[]).length,
      loans: (d.loans||[]).length,
    };
    const dateStr = obj.exportedAt ? new Date(obj.exportedAt).toLocaleString('pt-BR') : 'desconhecida';
    const ok = await askConfirm(
      `Backup de ${dateStr}:\n${counts.tx} transações, ${counts.tasks} tarefas, ${counts.env} caixinhas, ${counts.fix} fixos, ${counts.cards} cartões, ${counts.loans} empréstimos.\n\nSubstituir dados atuais?`
    );
    if (!ok) return;
    data = migrateData(d);
    // fix nextId
    const ids = [];
    for (const k of ['tasks','transactions','envelopes','fixedItems','cards','cardTx','loans']) {
      for (const x of (data[k]||[])) if (x.id) ids.push(x.id);
    }
    data.nextId = Math.max(data.nextId||1, ...ids, 0) + 1;
    saveData();
    toast('Backup restaurado');
    renderPage();
  } catch (e) {
    toast('Arquivo inválido: ' + e.message);
  }
}

// ============ Config ============

function renderConfig(main) {
  main.innerHTML = `
    <div class="page-header">
      <h1 class="page-title">Ajustes</h1>
    </div>
    <div class="card">
      <h3 class="card-title">Privacidade</h3>
      <button class="btn" id="toggleHide">${data.settings.hideValues?'Mostrar':'Ocultar'} valores</button>
    </div>
    <div class="card" style="margin-top:16px">
      <h3 class="card-title">Importar / Backup</h3>
      <button class="btn" data-page-btn="importar">Abrir Importar & Backup</button>
    </div>
    <div class="card" style="margin-top:16px">
      <h3 class="card-title">Categorias personalizadas</h3>
      <div class="list" id="customCats">
        ${(data.customCats||[]).map((c,i) => {
          const typeLabel = c.type === 'income' ? 'Receita' : c.type === 'expense' ? 'Despesa' : c.type === 'task' ? 'Tarefa' : 'Todos';
          const typePill = c.type === 'income' ? 'pill-success' : c.type === 'expense' ? 'pill-danger' : c.type === 'task' ? 'pill-accent' : 'pill-muted';
          return `<div class="list-item" style="cursor:default">
            <span class="cat-dot" style="background:${c.color};color:${c.color}"></span>
            <div class="list-item-main">
              <div class="list-item-name">${escapeHtml(c.icon||'')} ${escapeHtml(c.name)} <span class="pill ${typePill}">${typeLabel}</span></div>
            </div>
            <button class="btn btn-danger btn-icon" data-cat-del="${i}">${ICON.trash}</button>
          </div>`;
        }).join('')}
      </div>
      <div class="inline-row" style="margin-top:12px">
        <input id="ncName" placeholder="Nome da categoria" style="max-width:200px">
        <input id="ncIcon" placeholder="📌" maxlength="2" style="max-width:70px">
        <select id="ncType" style="max-width:140px">
          <option value="expense">Despesa</option>
          <option value="income">Receita</option>
          <option value="task">Tarefa</option>
          <option value="both">Todos</option>
        </select>
        <input id="ncColor" type="color" value="#00e59b" style="max-width:80px">
        <button class="btn btn-primary" id="ncAdd">Adicionar</button>
      </div>
    </div>
    ${currentUser ? `
    <div class="card" style="margin-top:16px">
      <h3 class="card-title">Conta</h3>
      <div style="font-size:13px; color:var(--text-muted); margin-bottom:12px">Logado como <strong style="color:var(--text)">${escapeHtml(currentUser.email)}</strong></div>
      <button class="btn" id="btnSignOut">Sair da conta</button>
    </div>` : ''}
    <div class="card" style="margin-top:16px; border-color:rgba(255,77,109,0.25)">
      <h3 class="card-title" style="color:var(--danger)">Zona de perigo</h3>
      <button class="btn btn-danger" id="btnReset" style="border:1px solid var(--danger)">Apagar todos os dados</button>
    </div>
  `;
  main.querySelector('#toggleHide').onclick = () => {
    data.settings.hideValues = !data.settings.hideValues;
    saveData();
    document.body.classList.toggle('hide-values', data.settings.hideValues);
    renderPage();
  };
  main.querySelectorAll('[data-page-btn]').forEach(b => b.onclick = () => { currentPage = b.dataset.pageBtn; renderPage(); });
  main.querySelector('#ncAdd').onclick = () => {
    const name = main.querySelector('#ncName').value.trim();
    if (!name) return;
    data.customCats = data.customCats || [];
    data.customCats.push({
      name,
      icon: main.querySelector('#ncIcon').value || '📌',
      color: main.querySelector('#ncColor').value,
      type: main.querySelector('#ncType').value,
    });
    saveData(); renderPage();
  };
  main.querySelectorAll('[data-cat-del]').forEach(b => b.onclick = async () => {
    if (await askConfirm('Excluir esta categoria?')) {
      data.customCats.splice(parseInt(b.dataset.catDel), 1);
      saveData(); renderPage();
    }
  });
  main.querySelector('#btnSignOut')?.addEventListener('click', async () => {
    if (await askConfirm('Sair da conta? Os dados ficam na nuvem; neste aparelho ficará vazio até você logar de novo.')) {
      await signOut();
    }
  });
  main.querySelector('#btnReset').onclick = async () => {
    if (await askConfirm('Isso apaga TUDO. Essa ação não pode ser desfeita. Continuar?')) {
      if (await askConfirm('Tem certeza mesmo? Pense em exportar o backup antes.')) {
        data = getDefaultData(); saveData(); currentPage = 'dashboard'; renderPage();
      }
    }
  };
}


// ============ Handlers ============

function attachHandlers(main) {
  // task toggle
  main.querySelectorAll('[data-task-toggle]').forEach(el => el.onclick = e => {
    e.stopPropagation();
    toggleTaskDone(parseInt(el.dataset.taskToggle), el.dataset.taskDate);
  });
  main.querySelectorAll('[data-task-expand]').forEach(el => el.onclick = e => {
    if (e.target.closest('[data-task-toggle]') || e.target.closest('[data-task-edit]') || e.target.closest('[data-task-notes]')) return;
    const key = el.dataset.taskExpand;
    if (expanded.has(key)) expanded.delete(key); else expanded.add(key);
    renderPage();
  });
  main.querySelectorAll('[data-task-edit]').forEach(el => el.onclick = e => {
    e.stopPropagation();
    openTaskModal(parseInt(el.dataset.taskEdit));
  });
  main.querySelectorAll('[data-task-notes]').forEach(el => el.onclick = e => {
    e.stopPropagation();
    const t = data.tasks.find(x => x.id === parseInt(el.dataset.taskNotes));
    if (t) openModal('Observações', `<div class="notes-area">${linkify(t.notes || '')}</div>`, '<button class="btn" data-close>Fechar</button>');
  });
  // sub-tasks
  main.querySelectorAll('[data-sub-toggle]').forEach(el => el.onchange = () => {
    const [tid, i] = el.dataset.subToggle.split(':').map(Number);
    const t = data.tasks.find(x => x.id === tid);
    if (t && t.subtasks[i]) { t.subtasks[i].done = !t.subtasks[i].done; saveData(); renderPage(); }
  });
  main.querySelectorAll('[data-sub-del]').forEach(el => el.onclick = () => {
    const [tid, i] = el.dataset.subDel.split(':').map(Number);
    const t = data.tasks.find(x => x.id === tid);
    if (t) { t.subtasks.splice(i,1); saveData(); renderPage(); }
  });
  main.querySelectorAll('[data-sub-add-btn]').forEach(el => el.onclick = () => {
    const tid = parseInt(el.dataset.subAddBtn);
    const input = main.querySelector(`[data-sub-add="${tid}"]`);
    const text = input.value.trim();
    if (!text) return;
    const t = data.tasks.find(x => x.id === tid);
    if (t) { t.subtasks.push({ text, done: false }); saveData(); renderPage(); }
  });
  main.querySelectorAll('[data-sub-add]').forEach(el => el.onkeydown = e => {
    if (e.key === 'Enter') main.querySelector(`[data-sub-add-btn="${el.dataset.subAdd}"]`).click();
  });

  // transactions
  main.querySelectorAll('[data-tx-edit]').forEach(el => el.onclick = () => openTxModal(parseInt(el.dataset.txEdit)));

  // budgets
  main.querySelectorAll('[data-budget-edit]').forEach(el => el.onclick = () => openBudgetModal(decodeURIComponent(el.dataset.budgetEdit)));
  main.querySelector('#newBudget')?.addEventListener('click', () => openBudgetModal(null));

  // fixed items
  main.querySelectorAll('[data-fixed-toggle]').forEach(el => el.onclick = () => toggleFixedPaid(parseInt(el.dataset.fixedToggle), financeMonth));
  main.querySelectorAll('[data-fixed-edit]').forEach(el => el.onclick = e => { e.stopPropagation(); openFixedModal(parseInt(el.dataset.fixedEdit)); });
  main.querySelectorAll('[data-new-fixed]').forEach(el => el.onclick = () => openFixedModal(null, el.dataset.newFixed));

  // cards
  main.querySelector('#newCard')?.addEventListener('click', () => openCardModal(null));
  main.querySelectorAll('[data-card-edit]').forEach(el => el.onclick = e => {
    if (e.target.closest('[data-card-tx]') || e.target.closest('[data-card-pay]')) return;
    openCardModal(parseInt(el.dataset.cardEdit));
  });
  main.querySelectorAll('[data-card-tx]').forEach(el => el.onclick = e => { e.stopPropagation(); openCardTxModal(parseInt(el.dataset.cardTx)); });
  main.querySelectorAll('[data-card-pay]').forEach(el => el.onclick = e => { e.stopPropagation(); payCardInvoice(parseInt(el.dataset.cardPay), financeMonth); });

  // loans
  main.querySelector('#newLoan')?.addEventListener('click', () => openLoanModal(null));
  main.querySelectorAll('[data-loan-edit]').forEach(el => el.onclick = e => { e.stopPropagation(); openLoanModal(parseInt(el.dataset.loanEdit)); });
  main.querySelectorAll('[data-loan-toggle]').forEach(el => el.onclick = () => toggleLoanPaid(parseInt(el.dataset.loanToggle), financeMonth));

  // envelopes
  main.querySelectorAll('[data-env-edit]').forEach(el => el.onclick = e => {
    if (e.target.closest('[data-env-deposit]')) return;
    openEnvModal(parseInt(el.dataset.envEdit));
  });
  main.querySelectorAll('[data-env-deposit]').forEach(el => el.onclick = e => { e.stopPropagation(); depositEnvelope(parseInt(el.dataset.envDeposit)); });

  // dashboard
  main.querySelector('#toggleEye')?.addEventListener('click', () => {
    data.settings.hideValues = !data.settings.hideValues;
    saveData();
    document.body.classList.toggle('hide-values', data.settings.hideValues);
    renderPage();
  });
  main.querySelectorAll('[data-goto]').forEach(el => el.onclick = () => { currentPage = el.dataset.goto; renderPage(); });
}

// ============ Reminders ============

setInterval(() => {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const now = new Date();
  const hm = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  const in15 = new Date(now.getTime() + 15*60000);
  const hm15 = String(in15.getHours()).padStart(2,'0') + ':' + String(in15.getMinutes()).padStart(2,'0');
  for (const t of getTasksForDate(now)) {
    if (!t.time || taskIsDone(t, now)) continue;
    if (t.time === hm15) {
      const key = 'rem_' + t.id + '_' + ymdKey(now);
      try {
        if (!sessionStorage.getItem(key)) {
          new Notification('Em 15 min: ' + t.name, { body: t.time, icon: '' });
          sessionStorage.setItem(key, '1');
        }
      } catch {}
    }
  }
}, 30000);

// ============ Init ============
boot();
</script>
