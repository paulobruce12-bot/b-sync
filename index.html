<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#121214">
<meta name="description" content="B.Sync — rotina e finanças pessoais">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="B.Sync">
<meta name="mobile-web-app-capable" content="yes">
<title>B.Sync</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  /* Dark Glass UI — B.Sync identity: Onyx base, mint/elec gradient, floating pill nav, FAB. */
  :root {
    --onyx: #121214;
    --onyx-deep: #0a0a0c;
    --surface: #1e1e24;
    --surface-glass: rgba(30, 30, 36, 0.55);
    --surface-elev: rgba(40, 40, 48, 0.75);
    --text: #ffffff;
    --text-muted: #a9a9b2;
    --text-dim: #6b6b74;
    --mint: #00e59b;
    --mint-soft: rgba(0, 229, 155, 0.14);
    --mint-glow: rgba(0, 229, 155, 0.4);
    --elec: #00a3ff;
    --elec-soft: rgba(0, 163, 255, 0.14);
    --elec-glow: rgba(0, 163, 255, 0.4);
    --border: rgba(255, 255, 255, 0.07);
    --border-strong: rgba(255, 255, 255, 0.14);
    --danger: #ff4d6d;
    --danger-soft: rgba(255, 77, 109, 0.14);
    --warning: #ffb84d;
    --warning-soft: rgba(255, 184, 77, 0.14);
    --grad: linear-gradient(135deg, #00a3ff 0%, #00e59b 100%);
    --grad-soft: linear-gradient(135deg, rgba(0,163,255,0.15) 0%, rgba(0,229,155,0.15) 100%);
    --radius: 20px;
    --radius-md: 16px;
    --radius-sm: 12px;
    --radius-xs: 8px;
    --font-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
    --nav-h: 72px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--onyx); }
  body {
    margin: 0;
    font-family: var(--font-sans);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    background:
      radial-gradient(ellipse 60% 40% at 20% 0%, rgba(0,163,255,0.08), transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 100%, rgba(0,229,155,0.06), transparent 60%),
      var(--onyx);
    background-attachment: fixed;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    padding-bottom: calc(var(--nav-h) + 48px + env(safe-area-inset-bottom, 0px));
  }
  button { font-family: inherit; }
  ::selection { background: var(--mint-soft); color: var(--mint); }

  /* ============ Layout ============ */
  .app { max-width: 760px; margin: 0 auto; padding: 20px 20px 0; }
  .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; gap: 12px; flex-wrap: wrap; }
  .page-title { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
  .page-sub { color: var(--text-muted); font-size: 13px; margin-top: 2px; }

  /* ============ Header + Brand ============ */
  .top-bar { display: flex; align-items: center; justify-content: space-between; padding: 8px 4px 20px; }
  .top-brand { display: flex; align-items: center; gap: 10px; }
  .brand-logo { width: 36px; height: 36px; border-radius: 10px; background: var(--onyx-deep); display: block; object-fit: contain; padding: 3px; box-shadow: 0 0 0 1px var(--border); }
  .brand-name { font-weight: 700; font-size: 16px; letter-spacing: -0.01em; }
  .top-actions { display: flex; gap: 8px; }

  /* ============ Glass surfaces ============ */
  .card, .tile {
    background: var(--surface-glass);
    backdrop-filter: blur(20px) saturate(1.2);
    -webkit-backdrop-filter: blur(20px) saturate(1.2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
  }
  .card-title { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 14px; }

  .grid { display: grid; gap: 12px; }
  .grid-2 { grid-template-columns: repeat(2, 1fr); }
  .grid-3 { grid-template-columns: repeat(3, 1fr); }
  .grid-4 { grid-template-columns: repeat(4, 1fr); }

  .tile { padding: 16px 18px; min-width: 0; }
  .tile-label { font-size: 11px; color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; }
  .tile-value { font-family: var(--font-mono); font-size: 24px; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .tile-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .pos { color: var(--mint); }
  .neg { color: var(--danger); }
  .accent-grad { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }

  /* ============ Sync meter ring ============ */
  .sync-hero {
    display: flex; align-items: center; gap: 20px;
    background: var(--surface-glass);
    backdrop-filter: blur(20px) saturate(1.2);
    -webkit-backdrop-filter: blur(20px) saturate(1.2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }
  .sync-hero::before {
    content: ''; position: absolute; inset: 0;
    background: var(--grad-soft);
    opacity: 0.25; z-index: -1;
  }
  .sync-ring { width: 92px; height: 92px; flex-shrink: 0; filter: drop-shadow(0 0 12px var(--mint-glow)); }
  .sync-ring .track { stroke: rgba(255,255,255,0.08); }
  .sync-ring .fill { stroke: url(#syncGrad); stroke-linecap: round; transition: stroke-dashoffset 0.8s cubic-bezier(.2,.9,.3,1); }
  .sync-score { font-family: var(--font-mono); font-size: 20px; font-weight: 700; fill: var(--text); dominant-baseline: central; text-anchor: middle; }
  .sync-score-sub { font-size: 9px; fill: var(--text-muted); dominant-baseline: central; text-anchor: middle; letter-spacing: 0.1em; text-transform: uppercase; }
  .sync-text .label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .sync-text .big { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; margin-top: 4px; }
  .sync-text .small { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

  /* ============ Buttons ============ */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 14px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: var(--surface-elev);
    color: var(--text); font-size: 13px; font-weight: 500;
    cursor: pointer; transition: background .15s, border-color .15s, transform .1s;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .btn:hover { background: rgba(255,255,255,0.08); border-color: var(--border-strong); }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--mint); border-color: var(--mint); color: var(--onyx); font-weight: 600; }
  .btn-primary:hover { background: var(--mint); filter: brightness(1.1); box-shadow: 0 0 20px var(--mint-glow); }
  .btn-accent { background: var(--elec); border-color: var(--elec); color: var(--onyx); font-weight: 600; }
  .btn-accent:hover { background: var(--elec); filter: brightness(1.1); box-shadow: 0 0 20px var(--elec-glow); }
  .btn-danger { color: var(--danger); border-color: transparent; background: transparent; }
  .btn-danger:hover { background: var(--danger-soft); }
  .btn-ghost { border-color: transparent; background: transparent; color: var(--text-muted); }
  .btn-ghost:hover { background: rgba(255,255,255,0.06); color: var(--text); }
  .btn-icon { padding: 7px; width: 34px; height: 34px; justify-content: center; }
  .btn-sm { padding: 6px 10px; font-size: 12px; }

  input, select, textarea {
    font-family: inherit; font-size: 13px;
    padding: 10px 12px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
    background: rgba(255,255,255,0.03); color: var(--text); width: 100%;
    transition: border-color .15s, background .15s;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--mint); background: rgba(255,255,255,0.05); box-shadow: 0 0 0 3px var(--mint-soft); }
  input[type="color"] { padding: 2px; height: 36px; }
  label { font-size: 11px; color: var(--text-muted); font-weight: 600; display: block; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
  .form-row { display: grid; gap: 12px; }
  .form-grid-2 { grid-template-columns: 1fr 1fr; }

  /* ============ Modals ============ */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.65);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    display: grid; place-items: center; z-index: 100; padding: 16px;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border-strong); border-radius: var(--radius);
    max-width: 460px; width: 100%; max-height: 90vh; overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
    animation: slideUp 0.25s cubic-bezier(.2,.9,.3,1);
  }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .modal-header { padding: 18px 22px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .modal-title { font-size: 17px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .modal-body { padding: 18px 22px; display: grid; gap: 14px; }
  .modal-footer { padding: 14px 22px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }

  /* ============ List items ============ */
  .list { display: flex; flex-direction: column; gap: 8px; }
  .list-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: rgba(255,255,255,0.02);
    cursor: pointer; min-width: 0;
    transition: border-color .15s, background .15s, transform .1s;
  }
  .list-item:hover { border-color: var(--border-strong); background: rgba(255,255,255,0.04); }
  .list-item:active { transform: scale(0.995); }
  .list-item-main { flex: 1; min-width: 0; }
  .list-item-name { font-weight: 500; font-size: 14px; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .list-item-sub { font-size: 12px; color: var(--text-muted); margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap; }
  .list-item-amount { font-family: var(--font-mono); font-weight: 700; font-variant-numeric: tabular-nums; font-size: 15px; white-space: nowrap; letter-spacing: -0.01em; }
  .ellip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .checkbox {
    width: 22px; height: 22px; border-radius: 7px;
    border: 1.5px solid var(--border-strong);
    display: grid; place-items: center; flex-shrink: 0;
    background: transparent; cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .checkbox:hover { border-color: var(--mint); }
  .checkbox.done { background: var(--mint); border-color: var(--mint); box-shadow: 0 0 12px var(--mint-glow); }
  .checkbox.done svg { color: var(--onyx); }

  .cat-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 8px currentColor; }
  .pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .pill-success { background: var(--mint-soft); color: var(--mint); }
  .pill-warning { background: var(--warning-soft); color: var(--warning); }
  .pill-danger { background: var(--danger-soft); color: var(--danger); }
  .pill-muted { background: rgba(255,255,255,0.06); color: var(--text-muted); }
  .pill-accent { background: var(--elec-soft); color: var(--elec); }

  .tabs { display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; padding: 4px; background: var(--surface-glass); border: 1px solid var(--border); border-radius: var(--radius-sm); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); width: fit-content; }
  .tab { padding: 7px 14px; background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 13px; font-weight: 600; border-radius: 8px; transition: background .15s, color .15s; }
  .tab.active { color: var(--onyx); background: var(--mint); box-shadow: 0 0 16px var(--mint-glow); }
  .tab:hover:not(.active) { color: var(--text); background: rgba(255,255,255,0.04); }

  .month-nav { display: inline-flex; align-items: center; gap: 4px; background: var(--surface-glass); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 2px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .month-label { font-weight: 600; min-width: 100px; text-align: center; font-size: 13px; }

  .progress { height: 6px; background: rgba(255,255,255,0.06); border-radius: 999px; overflow: hidden; margin-top: 8px; }
  .progress-bar { height: 100%; background: var(--grad); transition: width .4s; box-shadow: 0 0 8px var(--mint-glow); }
  .progress-bar.ok { background: var(--mint); box-shadow: 0 0 8px var(--mint-glow); }
  .progress-bar.warn { background: var(--warning); box-shadow: 0 0 8px rgba(255,184,77,0.4); }
  .progress-bar.over { background: var(--danger); box-shadow: 0 0 8px rgba(255,77,109,0.4); }

  .empty { text-align: center; padding: 32px 20px; color: var(--text-muted); }
  .empty-icon { width: 48px; height: 48px; margin: 0 auto 12px; opacity: 0.5; }

  .toast {
    position: fixed; bottom: calc(var(--nav-h) + 100px + env(safe-area-inset-bottom, 0px));
    left: 50%; transform: translateX(-50%);
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border-strong);
    padding: 11px 20px; border-radius: 999px; font-size: 13px; font-weight: 500;
    z-index: 200; opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s;
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .drag-area {
    border: 2px dashed var(--border-strong); border-radius: var(--radius);
    padding: 32px; text-align: center; color: var(--text-muted);
    cursor: pointer; transition: border-color .2s, background .2s, color .2s;
    background: rgba(255,255,255,0.02);
  }
  .drag-area:hover, .drag-area.dragging {
    border-color: var(--mint); background: var(--mint-soft); color: var(--mint);
  }

  .cat-bar-row { display: grid; grid-template-columns: 1fr 100px 48px; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .cat-bar-row:last-child { border-bottom: none; }
  .cat-bar-track { height: 6px; background: rgba(255,255,255,0.06); border-radius: 999px; overflow: hidden; }
  .cat-bar-fill { height: 100%; border-radius: 999px; }
  .cat-split { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .cat-donut-wrap { position: relative; width: 170px; height: 170px; flex-shrink: 0; }
  .cat-donut-wrap canvas { position: relative; z-index: 1; }
  .cat-donut-center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none; text-align: center;
  }
  .cat-donut-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
  .cat-donut-value { font-family: var(--font-mono); font-size: 17px; font-weight: 700; margin-top: 4px; letter-spacing: -0.02em; }
  .cat-bars { flex: 1; min-width: 220px; }
  .hide-values .cat-donut-value { filter: blur(8px); }

  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .alert-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius-sm); background: rgba(255,255,255,0.04); }
  .alert-row.danger { background: var(--danger-soft); color: var(--danger); }
  .alert-row.warning { background: var(--warning-soft); color: var(--warning); }

  .checklist { padding: 10px 14px 12px 46px; border-left: 2px solid var(--mint-soft); margin: -4px 0 8px 24px; display: flex; flex-direction: column; gap: 6px; }
  .checklist-item { display: flex; align-items: center; gap: 8px; }
  .checklist-item input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--mint); }
  .checklist-item.done span { text-decoration: line-through; color: var(--text-muted); }
  .checklist-add { display: flex; gap: 6px; margin-top: 4px; }
  .checklist-add input { flex: 1; padding: 6px 10px; font-size: 12px; }

  .notes-area { white-space: pre-wrap; font-size: 13px; background: rgba(255,255,255,0.04); padding: 12px 14px; border-radius: var(--radius-sm); margin-top: 6px; border: 1px solid var(--border); }
  .notes-area a { color: var(--elec); }

  .section-head { display: flex; justify-content: space-between; align-items: center; margin: 28px 0 12px; }
  .section-head h3 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
  .section-head .counter { font-size: 12px; color: var(--text-muted); font-family: var(--font-mono); }

  .fixed-row {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 14px;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: rgba(255,255,255,0.02);
    transition: background .15s;
  }
  .fixed-row:hover { background: rgba(255,255,255,0.04); }
  .fixed-row.paid { opacity: 0.5; }
  .fixed-row .fx-name { flex: 1; min-width: 0; }
  .fixed-row .fx-amount { font-family: var(--font-mono); font-weight: 700; font-variant-numeric: tabular-nums; }
  .fixed-row .fx-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 3px; }
  .tag-chip { background: rgba(255,255,255,0.06); color: var(--text-muted); font-size: 10px; padding: 2px 7px; border-radius: 999px; font-weight: 500; }

  .card-tile {
    padding: 18px; border-radius: var(--radius); color: white;
    position: relative; overflow: hidden; cursor: pointer;
    transition: transform .2s;
    box-shadow: 0 10px 30px rgba(0,0,0,.3);
  }
  .card-tile:hover { transform: translateY(-2px); }
  .card-tile .ct-label { font-size: 11px; opacity: 0.85; text-transform: uppercase; letter-spacing: 0.05em; }
  .card-tile .ct-name { font-size: 17px; font-weight: 700; margin-top: 4px; }
  .card-tile .ct-amount { font-family: var(--font-mono); font-size: 24px; font-weight: 700; margin-top: 12px; letter-spacing: -0.02em; }
  .card-tile .ct-sub { font-size: 12px; opacity: 0.9; margin-top: 2px; }

  .hide-values .tile-value, .hide-values .list-item-amount, .hide-values .fx-amount, .hide-values .ct-amount, .hide-values .sync-text .big { filter: blur(10px); user-select: none; }

  .inline-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  /* ============ Floating pill nav + FAB ============ */
  .nav-dock {
    position: fixed;
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    left: 0; right: 0;
    display: flex; justify-content: center;
    pointer-events: none;
    z-index: 50;
  }
  .nav-pill {
    pointer-events: auto;
    display: flex; align-items: center; gap: 2px;
    background: rgba(18, 18, 20, 0.75);
    backdrop-filter: blur(24px) saturate(1.5);
    -webkit-backdrop-filter: blur(24px) saturate(1.5);
    border: 1px solid var(--border-strong);
    border-radius: 999px;
    padding: 6px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
  }
  .nav-btn {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 9px 12px; border-radius: 999px;
    background: transparent; border: none; color: var(--text-muted);
    cursor: pointer; font-size: 10px; font-weight: 600;
    transition: background .15s, color .15s;
    min-width: 56px;
  }
  .nav-btn:hover { color: var(--text); background: rgba(255,255,255,0.04); }
  .nav-btn.active { color: var(--mint); background: var(--mint-soft); }
  .nav-btn.active svg { filter: drop-shadow(0 0 6px var(--mint-glow)); }
  .nav-btn svg { width: 20px; height: 20px; flex-shrink: 0; }

  .fab {
    pointer-events: auto;
    position: fixed;
    bottom: calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px));
    left: 50%; transform: translateX(-50%);
    width: 60px; height: 60px; border-radius: 50%;
    background: var(--mint); color: var(--onyx);
    border: none; cursor: pointer;
    display: grid; place-items: center;
    box-shadow:
      0 0 0 4px var(--onyx),
      0 10px 30px var(--mint-glow),
      0 0 24px var(--mint-glow);
    z-index: 55;
    transition: transform .25s cubic-bezier(.2,.9,.3,1);
  }
  .fab:hover { transform: translateX(-50%) scale(1.06); }
  .fab:active { transform: translateX(-50%) scale(0.96); }
  .fab svg { width: 26px; height: 26px; transition: transform .25s; }
  .fab.open svg { transform: rotate(45deg); }

  .fab-menu {
    pointer-events: auto;
    position: fixed;
    bottom: calc(var(--nav-h) + 100px + env(safe-area-inset-bottom, 0px));
    left: 50%; transform: translateX(-50%) scale(0.9);

function getDefaultData() {
  return {
    version: 1,
    tasks: [],
    transactions: [],
    envelopes: [],
    budgets: {},
    fixedItems: [],
    cards: [],
    cardTx: [],
    loans: [],
    customCats: [],
    nextId: 1,
    settings: { hideValues: false, theme: 'auto' },
  };
}

let data = loadData();
let currentPage = 'dashboard';
let financeMonth = ymKey(new Date());
let routineTab = 'hoje';
let txFilter = 'all';
let expanded = new Set();
let charts = {};

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return getDefaultData();
    const parsed = JSON.parse(raw);
    return migrateData(parsed);
  } catch (e) {
    console.warn('Falha ao ler dados, usando padrão', e);
    return getDefaultData();
  }
}

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) {
    toast('Não foi possível salvar: ' + e.message);
  }
  // Trigger debounced cloud push if logged in
  if (currentUser && !suppressNextPush) {
    schedulePushToCloud();
  }
  suppressNextPush = false;
}

function schedulePushToCloud() {
  clearTimeout(cloudPushTimer);
  setCloudStatus('syncing');
  cloudPushTimer = setTimeout(pushToCloud, 400);
}

async function pushToCloud() {
  if (!sb || !currentUser) return;
  try {
    const now = new Date().toISOString();
    const { error } = await sb.from('app_state').upsert({
      user_id: currentUser.id,
      data: data,
      updated_at: now,
    });
    if (error) throw error;
    lastKnownUpdatedAt = now;
    setCloudStatus('synced');
  } catch (e) {
    console.error('Push to cloud failed:', e);
    setCloudStatus('error');
  }
}

async function pullFromCloud() {
  if (!sb || !currentUser) return null;
  try {
    const { data: row, error } = await sb
      .from('app_state')
      .select('data, updated_at')
      .eq('user_id', currentUser.id)
      .maybeSingle();
    if (error) throw error;
    return row;
  } catch (e) {
    console.error('Pull from cloud failed:', e);
    return null;
  }
}

async function applyCloudData(cloudData, cloudUpdatedAt) {
  suppressNextPush = true;
  data = migrateData(cloudData);
  // fix nextId
  const ids = [];
  for (const k of ['tasks','transactions','envelopes','fixedItems','cards','cardTx','loans']) {
    for (const x of (data[k]||[])) if (x.id) ids.push(x.id);
  }
  data.nextId = Math.max(data.nextId||1, ...ids, 0) + 1;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {}
  lastKnownUpdatedAt = cloudUpdatedAt;
  renderPage();
}

function startRealtimeChannel() {
  if (!sb || !currentUser) return;
  if (cloudChannel) sb.removeChannel(cloudChannel);
  cloudChannel = sb
    .channel('app_state_user_' + currentUser.id)
    .on('postgres_changes',
      { event: '*', schema: 'public', table: 'app_state', filter: 'user_id=eq.' + currentUser.id },
      async (payload) => {
        const newRow = payload.new;
        if (!newRow || newRow.updated_at === lastKnownUpdatedAt) return;
        await applyCloudData(newRow.data, newRow.updated_at);
        toast('Dados atualizados');
      })
    .subscribe();
}

function stopRealtimeChannel() {
  if (cloudChannel) { sb.removeChannel(cloudChannel); cloudChannel = null; }
}

function setCloudStatus(s) {
  cloudStatus = s;
  const dot = document.getElementById('cloudDot');
  if (dot) {
    dot.className = 'cloud-dot ' + s;
    dot.title = {
      offline: 'Offline',
      syncing: 'Sincronizando...',
      synced: 'Sincronizado',
      error: 'Erro ao sincronizar',
    }[s] || s;
  }
}

// ============ Auth ============

async function signUp(email, password) {
  if (!sb) throw new Error('Supabase não carregado');
  const { data: res, error } = await sb.auth.signUp({ email, password });
  if (error) throw error;
  return res;
}

async function signIn(email, password) {
  if (!sb) throw new Error('Supabase não carregado');
  const { data: res, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) throw error;
  return res;
}

async function signOut() {
  if (!sb) return;
  stopRealtimeChannel();
  await sb.auth.signOut();
  session = null; currentUser = null;
  // clear local data so next login starts fresh
  try { localStorage.removeItem(STORAGE_KEY); } catch {}
  data = getDefaultData();
boot();
}

function translateAuthError(msg) {
  const m = (msg||'').toLowerCase();
  if (m.includes('invalid login credentials')) return 'E-mail ou senha incorretos.';
  if (m.includes('email not confirmed')) return 'Confirme seu e-mail antes de entrar (olhe sua caixa de entrada).';
  if (m.includes('user already registered')) return 'Esse e-mail já tem conta. Faça login.';
  if (m.includes('password should be')) return 'A senha precisa ter pelo menos 6 caracteres.';
  if (m.includes('invalid email')) return 'E-mail inválido.';
  if (m.includes('rate limit')) return 'Muitas tentativas. Espere um momento e tente de novo.';
  return msg || 'Erro desconhecido.';
}

// ============ Boot flow with auth ============

async function boot() {
  if (!sb) {
    // No Supabase — fall back to local-only mode
boot();
    return;
  }
  const { data: sessionData } = await sb.auth.getSession();
  session = sessionData?.session || null;
  currentUser = session?.user || null;

  if (!currentUser) {
    renderLogin();
    return;
  }

  // Logged in: check cloud vs local
  await handleFirstLoginMerge();
  startRealtimeChannel();
boot();
  setCloudStatus('synced');
}

async function handleFirstLoginMerge() {
  const cloudRow = await pullFromCloud();
  const localHasData = (data.transactions||[]).length > 0 ||
                       (data.tasks||[]).length > 0 ||
                       (data.envelopes||[]).length > 0 ||
                       (data.fixedItems||[]).length > 0;
  const cloudHasData = cloudRow && cloudRow.data && (
    (cloudRow.data.transactions||[]).length > 0 ||
    (cloudRow.data.tasks||[]).length > 0 ||
    (cloudRow.data.envelopes||[]).length > 0 ||
    (cloudRow.data.fixedItems||[]).length > 0
  );

  if (!cloudHasData && localHasData) {
    // Upload local to cloud
    await pushToCloud();
  } else if (cloudHasData && !localHasData) {
    // Download cloud to local
    await applyCloudData(cloudRow.data, cloudRow.updated_at);
  } else if (cloudHasData && localHasData) {
    // Ask user which to keep
    const chose = await askMergeChoice(cloudRow.data, data);
    if (chose === 'cloud') {
      await applyCloudData(cloudRow.data, cloudRow.updated_at);
    } else {
      await pushToCloud();
    }
  } else {
    // Both empty — nothing to do; next save will push
    lastKnownUpdatedAt = cloudRow?.updated_at || null;
  }
}

function countOf(d) {
  return {
    tx: (d.transactions||[]).length,
    tasks: (d.tasks||[]).length,
    env: (d.envelopes||[]).length,
    fix: (d.fixedItems||[]).length,
  };
}

function askMergeChoice(cloudData, localData) {
  return new Promise(resolve => {
    const c = countOf(cloudData), l = countOf(localData);
    const body = `
      <p style="margin:0 0 8px">Você tem dados em dois lugares. Qual quer usar?</p>

            ${c.tx} transações<br>${c.tasks} tarefas<br>${c.env} caixinhas<br>${c.fix} fixos
          </div>
        </div>
        <div class="card" style="cursor:pointer; padding:14px" id="chLocal">
          <div style="font-weight:700; color:var(--elec); margin-bottom:6px">💾 Deste aparelho</div>
          <div style="font-size:12px; color:var(--text-muted)">
            ${l.tx} transações<br>${l.tasks} tarefas<br>${l.env} caixinhas<br>${l.fix} fixos
          </div>
        </div>
      </div>
      <p style="font-size:11px; color:var(--text-muted); margin:4px 0 0">A escolha substitui o que estiver no outro lado. Faça um backup antes se tiver dúvida.</p>
    `;
    const m = openModal('Qual versão usar?', body, '');
    m.querySelector('#chCloud').onclick = () => { m.remove(); resolve('cloud'); };
    m.querySelector('#chLocal').onclick = () => { m.remove(); resolve('local'); };
  });
}

      app.querySelectorAll('.login-tab').forEach(x => x.classList.toggle('active', x === b));
      submitBtn.textContent = mode === 'signin' ? 'Entrar' : 'Criar conta';
      passEl.autocomplete = mode === 'signin' ? 'current-password' : 'new-password';
      errEl.hidden = true;
    };
  });

  app.querySelector('#loginForm').onsubmit = async (e) => {
    e.preventDefault();
    errEl.hidden = true;
    submitBtn.disabled = true;
    submitBtn.textContent = mode === 'signin' ? 'Entrando...' : 'Criando...';
    try {
      if (mode === 'signin') {
        await signIn(emailEl.value.trim(), passEl.value);
      } else {
        const r = await signUp(emailEl.value.trim(), passEl.value);
        if (r.user && !r.session) {
          errEl.textContent = 'Conta criada! Confirme seu e-mail e volte aqui para entrar.';
          errEl.hidden = false;
          submitBtn.disabled = false;
          submitBtn.textContent = 'Entrar';
          return;
        }
      }
      // Re-boot with session
      const { data: sessionData } = await sb.auth.getSession();
      session = sessionData?.session || null;
      currentUser = session?.user || null;
      await handleFirstLoginMerge();
      startRealtimeChannel();
boot();
      setCloudStatus('synced');
    } catch (ex) {
      errEl.textContent = translateAuthError(ex.message);
      errEl.hidden = false;
      submitBtn.disabled = false;
      submitBtn.textContent = mode === 'signin' ? 'Entrar' : 'Criar conta';
    }
  };
}


function migrateData(d) {
  const def = getDefaultData();
  for (const k of Object.keys(def)) {
    if (d[k] === undefined) d[k] = def[k];
  }
  if (!d.settings) d.settings = def.settings;
  for (const k of Object.keys(def.settings)) {
    if (d.settings[k] === undefined) d.settings[k] = def.settings[k];
  }
  // ensure every tx has subtasks if task
  for (const t of d.tasks) {
    if (!Array.isArray(t.subtasks)) t.subtasks = [];
  }
  return d;
}

function nextId() {
  const id = data.nextId;
  data.nextId = id + 1;
  return id;
}

function money(v) {
  const n = Number(v) || 0;
  return 'R$ ' + n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function ymKey(d) {
  if (typeof d === 'string') d = new Date(d + 'T00:00:00');
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function ymdKey(d) {
  if (!(d instanceof Date)) d = new Date(d);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function parseDate(s) { return new Date(s + 'T00:00:00'); }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function startOfWeek(d) {
  const x = new Date(d); const day = x.getDay();
  const diff = (day === 0 ? -6 : 1 - day);
  return addDays(x, diff);
}
function monthName(ymStr) {
  const [y,m] = ymStr.split('-').map(Number);
  const names = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  return names[m-1] + ' ' + y;
}
function monthShort(ymStr) {
  const [,m] = ymStr.split('-').map(Number);
  const names = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  return names[m-1];
}
function dayName(d) {
  const names = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  return names[d.getDay()];
}
function normalizeName(s) {
  return (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
}

function catColor(cat) {
  if (CAT_META[cat]) return CAT_META[cat].color;
  const cc = (data.customCats||[]).find(c => c.name === cat);
  return cc?.color || '#64748b';
}
function catIcon(cat) {
  if (CAT_META[cat]) return CAT_META[cat].icon;
  const cc = (data.customCats||[]).find(c => c.name === cat);
  return cc?.icon || '📌';
}
function allCats() {
  return [...DEFAULT_CATS, ...(data.customCats||[]).map(c => c.name)];
}
function catsForType(type) {
  const base = type === 'income' ? INCOME_CATS
             : type === 'task'   ? TASK_CATS
             : EXPENSE_CATS;
  const custom = (data.customCats||[])
    .filter(c => !c.type || c.type === type || c.type === 'both')
    .map(c => c.name);
  // Keep "Outros" at the end
  const combined = [...base.filter(c => c !== 'Outros'), ...custom, 'Outros'];
  // Dedup
  return [...new Set(combined)];
}

function escapeHtml(s) {
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function linkify(s) {
  const esc = escapeHtml(s);
  return esc.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
}

// ============ Modals / Toast ============

function openModal(title, bodyHtml, actions) {
  const existing = document.querySelector('.modal-backdrop');
  if (existing) existing.remove();
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">${escapeHtml(title)}</h3>
        <button class="btn btn-ghost btn-icon" data-close>✕</button>
      </div>
      <div class="modal-body">${bodyHtml}</div>
      <div class="modal-footer">${actions || ''}</div>
    </div>`;
  backdrop.addEventListener('click', e => {
    if (e.target === backdrop || e.target.hasAttribute('data-close')) backdrop.remove();
  });
  document.body.appendChild(backdrop);
  const firstInput = backdrop.querySelector('input, select, textarea');
  if (firstInput) firstInput.focus();
  return backdrop;
}
function closeModal() {
  document.querySelector('.modal-backdrop')?.remove();
}

function askConfirm(message) {
  return new Promise(resolve => {
    const m = openModal('Confirmar', `<p style="margin:0">${escapeHtml(message)}</p>`,
      `<button class="btn" data-close>Cancelar</button>
       <button class="btn btn-primary" id="cfOk">Confirmar</button>`);
    m.querySelector('#cfOk').onclick = () => { m.remove(); resolve(true); };
    m.addEventListener('click', e => {
      if (e.target.hasAttribute('data-close') || e.target === m) resolve(false);
    });
  });
}

function askAmount(message, initial) {
  return new Promise(resolve => {
    const m = openModal('Valor', `
      <label>${escapeHtml(message)}</label>
      <input type="number" step="0.01" id="amtIn" value="${initial ?? ''}" placeholder="0,00">`,
      `<button class="btn" data-close>Cancelar</button>
       <button class="btn btn-primary" id="amtOk">OK</button>`);
    const inp = m.querySelector('#amtIn');
    const ok = () => { const v = parseFloat(inp.value); m.remove(); resolve(isNaN(v) ? null : v); };
    m.querySelector('#amtOk').onclick = ok;
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') ok(); });
    m.addEventListener('click', e => {
      if (e.target.hasAttribute('data-close') || e.target === m) resolve(null);
    });
  });
}

let toastTimeout;
function haptic(ms = 10) {
  try { if (navigator.vibrate) navigator.vibrate(ms); } catch {}
}
function toast(msg) {
  let el = document.querySelector('.toast');
  if (!el) {
    el = document.createElement('div');
    el.className = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => el.classList.remove('show'), 2200);
}

// ============ Task recurrence ============

function getTasksForDate(date) {
  const ymd = ymdKey(date);
  const dow = date.getDay();
  const dom = date.getDate();
  const out = [];
  for (const t of data.tasks) {
    const rec = t.recurrence || 'none';
    if (rec === 'none') {
      if (t.date === ymd) out.push(t);
      continue;
    }
    // skip tasks that start after this date
    if (t.date && parseDate(t.date) > date) continue;
    if (rec === 'daily') out.push(t);
    else if (rec === 'weekly') {
      const base = t.date ? parseDate(t.date).getDay() : dow;
      if (base === dow) out.push(t);
    } else if (rec === 'monthly') {
      const base = t.date ? parseDate(t.date).getDate() : dom;
      if (base === dom) out.push(t);
    } else if (rec === 'weekdays' && dow >= 1 && dow <= 5) out.push(t);
  }
  return out.sort((a,b) => (a.time||'').localeCompare(b.time||''));
}

function taskIsDone(t, date) {
  const ymd = typeof date === 'string' ? date : ymdKey(date);
  if ((t.recurrence || 'none') === 'none') return !!t.done;
  return (t.doneDates || []).includes(ymd);
}

function toggleTaskDone(id, date) {
  const t = data.tasks.find(x => x.id === id);
  if (!t) return;
  haptic(15);
  const ymd = typeof date === 'string' ? date : ymdKey(date);
  if ((t.recurrence || 'none') === 'none') {
    t.done = !t.done;
  } else {
    if (!t.doneDates) t.doneDates = [];
    const i = t.doneDates.indexOf(ymd);
    if (i >= 0) t.doneDates.splice(i, 1);
    else t.doneDates.push(ymd);
  }
  saveData(); renderPage();
}

// ============ Transactions / budgets ============

function txMatchesCat(t, cat) {
  if (t.cat === cat) return true;
  if (t.cat === 'Outros' && t.subcat && normalizeName(t.subcat) === normalizeName(cat)) return true;
  return false;
}

function budgetSpent(cat, monthPrefix) {
  const txs = data.transactions.filter(t => t.date.startsWith(monthPrefix) && txMatchesCat(t, cat));
  const gross = txs.filter(t => t.type === 'expense').reduce((s,t) => s + Number(t.amount||0), 0);
  const refunds = txs.filter(t => t.type === 'income').reduce((s,t) => s + Number(t.amount||0), 0);
  return Math.max(0, gross - refunds);
}

function monthTotals(monthPrefix) {
  const txs = data.transactions.filter(t => t.date.startsWith(monthPrefix));
  const inc = txs.filter(t => t.type === 'income').reduce((s,t) => s + Number(t.amount||0), 0);
  const exp = txs.filter(t => t.type === 'expense').reduce((s,t) => s + Number(t.amount||0), 0);
  return { inc, exp, net: inc - exp, count: txs.length };
}

function changeMonth(delta) {
  if (!financeMonth) financeMonth = ymKey(new Date());
  const [y,m] = financeMonth.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  financeMonth = ymKey(d);
  renderPage();
}

// ============ Fixed items helpers ============

function fixedPaidThisMonth(f, monthPrefix) {
  return data.transactions.some(t => t.fixedId === f.id && t.date.startsWith(monthPrefix));
}
function toggleFixedPaid(id, monthPrefix) {
  const f = data.fixedItems.find(x => x.id === id);
  if (!f) return;
  const existing = data.transactions.find(t => t.fixedId === id && t.date.startsWith(monthPrefix));
  if (existing) {
    data.transactions = data.transactions.filter(t => t !== existing);
  } else {
    const extra = (f.extras || {})[monthPrefix] || 0;
    const amount = Number(f.amount||0) + (f.type === 'income' ? Number(extra||0) : 0);
    const day = Math.min(Math.max(1, f.day || 1), 28);
    data.transactions.push({
      id: nextId(),
      name: f.name,
      amount,
      type: f.type || 'expense',
      cat: f.cat || 'Outros',
      date: `${monthPrefix}-${String(day).padStart(2,'0')}`,
      fixedId: f.id,
    });
  }
  saveData(); renderPage();
}

        ${navButton('fixos', ICON.fixed, 'Fixos')}
        ${navButton('caixinhas', ICON.piggy, 'Caixinhas')}
      </nav>
    </div>`;

  app.querySelectorAll('.nav-btn').forEach(b => {
    b.onclick = () => { currentPage = b.dataset.page; haptic(10); renderPage(); };
  });
  app.querySelectorAll('[data-page-btn]').forEach(b => {
    b.onclick = () => { currentPage = b.dataset.pageBtn; renderPage(); };
  });
  // Top-bar toggle for hide values
  document.getElementById('toggleEye').onclick = () => {
    data.settings.hideValues = !data.settings.hideValues;
    saveData();
    document.body.classList.toggle('hide-values', data.settings.hideValues);
    // Rebuild top-bar icon state
    const btn = document.getElementById('toggleEye');
    btn.innerHTML = data.settings.hideValues ? ICON.eyeOff : ICON.eye;
    btn.title = (data.settings.hideValues ? 'Mostrar' : 'Ocultar') + ' valores';
  };
  // FAB wiring
  const fab = document.getElementById('fab');
  const fabMenu = document.getElementById('fabMenu');
  fab.onclick = e => {
    e.stopPropagation();
    const open = fab.classList.toggle('open');
    fabMenu.classList.toggle('open', open);
    haptic(open ? 12 : 8);
  };
  document.addEventListener('click', e => {
    if (fab.classList.contains('open') && !fab.contains(e.target) && !fabMenu.contains(e.target)) {
      fab.classList.remove('open'); fabMenu.classList.remove('open');
    }
  });
  fabMenu.querySelectorAll('[data-fab-opt]').forEach(b => {
    b.onclick = () => {
      fab.classList.remove('open'); fabMenu.classList.remove('open');
      haptic(10);
      if (b.dataset.fabOpt === 'task') openTaskModal(null, ymdKey(new Date()));
      else openTxModal(null);
    };
  });

  if (data.settings.hideValues) document.body.classList.add('hide-values');
  else document.body.classList.remove('hide-values');
  renderPage();
}

function navButton(page, icon, label) {
  const active = currentPage === page ? 'active' : '';
  return `<button class="nav-btn ${active}" data-page="${page}">${icon}<span>${label}</span></button>`;
}

function renderPage() {
  // Keep nav state in sync
  document.querySelectorAll('.nav-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.page === currentPage);
  });
  const main = document.getElementById('main');
  if (!main) return;
  // Destroy existing charts to prevent canvas reuse errors
  for (const k of Object.keys(charts)) { charts[k]?.destroy?.(); delete charts[k]; }
  switch (currentPage) {
    case 'dashboard': renderDashboard(main); break;
    case 'rotina': renderRotina(main); break;
    case 'financeiro': renderFinanceiro(main); break;
    case 'fixos': renderFixos(main); break;
    case 'caixinhas': renderCaixinhas(main); break;
    case 'importar': renderImportar(main); break;
    case 'config': renderConfig(main); break;
  }
  attachHandlers(main);
}

// ============ Dashboard ============

function renderDashboard(main) {
  const today = new Date();
  const ym = ymKey(today);
  const totals = monthTotals(ym);
  const todayTasks = getTasksForDate(today);
  const todayDone = todayTasks.filter(t => taskIsDone(t, today)).length;
  const now = new Date();
  const nowHM = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  const late = todayTasks.filter(t => t.time && t.time < nowHM && !taskIsDone(t, today));
  const upcoming = todayTasks.filter(t => t.time && t.time >= nowHM && !taskIsDone(t, today)).slice(0, 3);
  const budgetAlerts = [];
  for (const [cat, limit] of Object.entries(data.budgets)) {
    const spent = budgetSpent(cat, ym);
    const pct = limit > 0 ? spent/limit : 0;
    if (pct >= 0.8) budgetAlerts.push({cat, spent, limit, pct});
  }
  budgetAlerts.sort((a,b) => b.pct - a.pct);

  // Sync score: weighted average of what actually exists today
  // (tasks completion + budget health). If neither exists → undefined (shown as "—").
  const budgetKeys = Object.keys(data.budgets);
  const hasTasks = todayTasks.length > 0;
  const hasBudgets = budgetKeys.length > 0;
  let sync = null;
  if (hasTasks || hasBudgets) {
    const parts = [];
    if (hasTasks) parts.push(todayDone / todayTasks.length);
    if (hasBudgets) {
      let total = 0;
      for (const [cat, limit] of Object.entries(data.budgets)) {
        const spent = budgetSpent(cat, ym);
        total += Math.max(0, 1 - (spent / limit));
      }
      parts.push(total / budgetKeys.length);
    }
    sync = Math.round((parts.reduce((s,v) => s+v, 0) / parts.length) * 100);
  }
  const R = 42, C = 2 * Math.PI * R;
  const dashOffset = sync === null ? C : C * (1 - sync / 100);
  const greet = today.getHours() < 12 ? 'Bom dia' : today.getHours() < 18 ? 'Boa tarde' : 'Boa noite';
  const dateStr = capitalize(today.toLocaleDateString('pt-BR', { weekday:'long', day:'numeric', month:'long' }));

  // Hero summary text: show what the user actually has
  let bigText, smallText;
  if (hasTasks) {
    const remaining = todayTasks.length - todayDone;
    bigText = `${todayDone}/${todayTasks.length} tarefas · ${money(totals.net).replace('R$ ','R$')}`;
    smallText = `${late.length ? `${late.length} atrasada${late.length>1?'s':''} · ` : ''}${remaining} restante${remaining !== 1 ? 's':''}`;
  } else if (totals.count > 0) {
    bigText = money(totals.net).replace('R$ ','R$');
    smallText = `${totals.count} lançamento${totals.count>1?'s':''} este mês`;
  } else {
    bigText = 'Tudo tranquilo';
    smallText = 'Sem tarefas pra hoje e nenhum lançamento ainda';
  }

  main.innerHTML = `
    <div class="page-header">
      <div>
        <h1 class="page-title">${greet}</h1>
        <p class="page-sub">${dateStr}</p>
      </div>
    </div>

    <div class="sync-hero">
      <svg class="sync-ring" viewBox="0 0 100 100">
        <circle class="track" cx="50" cy="50" r="${R}" fill="none" stroke-width="8"/>
        <circle class="fill" cx="50" cy="50" r="${R}" fill="none" stroke-width="8"
                stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${dashOffset.toFixed(2)}"
                transform="rotate(-90 50 50)"/>
        <text class="sync-score" x="50" y="48">${sync === null ? '—' : sync + '%'}</text>
        <text class="sync-score-sub" x="50" y="64">SYNC</text>
      </svg>
      <div class="sync-text">
        <div class="label">Seu dia</div>
        <div class="big accent-grad">${bigText}</div>
        <div class="small">${smallText}</div>
      </div>
    </div>

    <div class="grid grid-3">
      <div class="tile"><div class="tile-label">Receitas</div><div class="tile-value pos">${money(totals.inc)}</div></div>
      <div class="tile"><div class="tile-label">Despesas</div><div class="tile-value neg">${money(totals.exp)}</div></div>
      <div class="tile"><div class="tile-label">Saldo</div><div class="tile-value ${totals.net>=0?'pos':'neg'}">${money(totals.net)}</div></div>
    </div>

    ${late.length ? `
      <div class="card" style="margin-top:16px; border-color:rgba(255,77,109,0.3)">
        <h3 class="card-title" style="color:var(--danger)">Atrasadas (${late.length})</h3>
        <div class="list">
          ${late.map(t => taskRow(t, today, {compact:true})).join('')}
        </div>
      </div>` : ''}

    ${upcoming.length ? `
      <div class="card" style="margin-top:16px">
        <h3 class="card-title">Próximas tarefas</h3>
        <div class="list">
          ${upcoming.map(t => taskRow(t, today, {compact:true})).join('')}
        </div>
      </div>` : ''}

    ${budgetAlerts.length ? `
      <div class="card" style="margin-top:16px">
        <h3 class="card-title">Orçamentos no limite</h3>
        <div class="list">
          ${budgetAlerts.map(b => {
            const pct = Math.min(100, Math.round(b.pct*100));
            const cls = b.pct > 1 ? 'over' : b.pct > 0.9 ? 'warn' : 'ok';
            return `<div class="list-item" style="cursor:default">
              <div class="cat-dot" style="background:${catColor(b.cat)};color:${catColor(b.cat)}"></div>
              <div class="list-item-main">
                <div class="list-item-name">${escapeHtml(b.cat)}</div>
                <div class="list-item-sub">${money(b.spent)} de ${money(b.limit)} — ${pct}%</div>
                <div class="progress"><div class="progress-bar ${cls}" style="width:${Math.min(100,pct)}%"></div></div>
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>` : ''}

    ${todayTasks.length === 0 && data.transactions.length === 0 ? emptyStart() : ''}
  `;
}

function emptyStart() {
  return `<div class="card" style="margin-top:16px">
    <h3 class="card-title">Comece por aqui</h3>
    <p>Bem-vindo ao B.Sync. Suas rotinas e finanças ficam salvas no próprio navegador.</p>
    <div class="inline-row" style="margin-top:10px">
      <button class="btn btn-primary" data-goto="rotina">Criar primeira tarefa</button>
      <button class="btn" data-goto="financeiro">Lançar transação</button>
      <button class="btn" data-goto="importar">Importar extrato</button>
    </div>
  </div>`;
}

function capitalize(s) { return s ? s[0].toUpperCase() + s.slice(1) : s; }

// ============ Rotina ============

function renderRotina(main) {
  const today = new Date();
  const tabDays = {
    hoje: [today],
    amanha: [addDays(today, 1)],
    semana: Array.from({length:7}, (_,i) => addDays(startOfWeek(today), i)),
    mes: monthDays(today),
  };
  const days = tabDays[routineTab] || [today];

  main.innerHTML = `
    <div class="page-header">
      <div>
        <h1 class="page-title">Rotina</h1>
        <p class="page-sub">Suas tarefas, hoje e nos próximos dias</p>
      </div>
      <button class="btn btn-primary" id="newTask">${ICON.plus} Nova tarefa</button>
    </div>
    <div class="tabs">
      ${tab('hoje','Hoje')}${tab('amanha','Amanhã')}${tab('semana','Semana')}${tab('mes','Mês')}
    </div>
    <div class="list" id="taskList">
      ${days.map(d => dayGroup(d)).join('') || '<div class="empty">Nenhuma tarefa.</div>'}
    </div>
  `;

  function tab(id, label) {
    return `<button class="tab ${routineTab===id?'active':''}" data-tab="${id}">${label}</button>`;
  }

  main.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { routineTab = b.dataset.tab; renderPage(); });
  main.querySelector('#newTask').onclick = () => openTaskModal(null, ymdKey(today));
}

function monthDays(d) {
  const y = d.getFullYear(), m = d.getMonth();
  const last = new Date(y, m+1, 0).getDate();
  return Array.from({length:last}, (_,i) => new Date(y, m, i+1));
}

function dayGroup(d) {
  const tasks = getTasksForDate(d);
  if (!tasks.length) return '';
  const ymd = ymdKey(d);
  const header = `<div style="margin:16px 0 6px; font-weight:600; font-size:13px; color:var(--text-muted)">
    ${dayName(d)}, ${d.getDate()}/${String(d.getMonth()+1).padStart(2,'0')}
  </div>`;
  return header + tasks.map(t => taskRow(t, d)).join('');
}

function taskRow(t, date, opts = {}) {
  const ymd = ymdKey(date);
  const done = taskIsDone(t, ymd);
  const expKey = t.id + '|' + ymd;
  const isExpanded = expanded.has(expKey);
  const subtasks = t.subtasks || [];
  const subDone = subtasks.filter(s => s.done).length;
  return `
    <div class="list-item" data-task-expand="${expKey}" style="${done ? 'opacity:.55' : ''}">
      <div class="checkbox ${done ? 'done' : ''}" data-task-toggle="${t.id}" data-task-date="${ymd}">${done ? ICON.check : ''}</div>
      <div class="list-item-main">
        <div class="list-item-name ellip">
          <span class="cat-dot" style="background:${catColor(t.cat)}"></span>
          ${escapeHtml(t.name)}
          ${subtasks.length ? `<span class="pill pill-muted">${subDone}/${subtasks.length}</span>` : ''}
        </div>
        <div class="list-item-sub">
          ${t.time ? `<span>${ICON.clock} ${escapeHtml(t.time)}</span>` : ''}
          <span>${escapeHtml(t.cat || 'Outros')}</span>
          ${t.recurrence && t.recurrence !== 'none' ? `<span class="pill pill-muted">${recLabel(t.recurrence)}</span>` : ''}
        </div>
      </div>
      ${t.notes ? `<button class="btn btn-icon btn-ghost" data-task-notes="${t.id}" title="Observações">${ICON.note}</button>` : ''}
      <button class="btn btn-icon btn-ghost" data-task-edit="${t.id}">${ICON.edit}</button>
    </div>
    ${isExpanded && !opts.compact ? renderChecklist(t, ymd) : ''}
  `;
}

function recLabel(r) {
  return ({daily:'Diária', weekly:'Semanal', monthly:'Mensal', weekdays:'Dias úteis'})[r] || r;
}

function renderChecklist(t, ymd) {
  const items = t.subtasks || [];
  return `
    <div class="checklist" data-checklist="${t.id}">
      ${items.map((it, i) => `
        <div class="checklist-item ${it.done?'done':''}">
          <input type="checkbox" ${it.done?'checked':''} data-sub-toggle="${t.id}:${i}">
          <span>${escapeHtml(it.text)}</span>
          <button class="btn btn-ghost btn-icon" style="margin-left:auto" data-sub-del="${t.id}:${i}">✕</button>
        </div>`).join('')}
      <div class="checklist-add">
        <input placeholder="Adicionar item..." data-sub-add="${t.id}">
        <button class="btn btn-sm" data-sub-add-btn="${t.id}">+</button>
      </div>
    </div>
  `;
}

function openTaskModal(id, defaultDate) {
  const t = id ? data.tasks.find(x => x.id === id) : null;
  let catList = catsForType('task');
  if (t?.cat && !catList.includes(t.cat)) catList = [t.cat, ...catList];
  const catOptions = catList.map(c => `<option value="${escapeHtml(c)}" ${t?.cat===c?'selected':''}>${escapeHtml(c)}</option>`).join('');
  const rec = t?.recurrence || 'none';
  const body = `
    <div class="form-row">
      <div><label>Nome</label><input id="tName" value="${escapeHtml(t?.name || '')}" placeholder="Ex: Correr no parque"></div>
    </div>
    <div class="form-row form-grid-2">
      <div><label>Data</label><input id="tDate" type="date" value="${t?.date || defaultDate || ymdKey(new Date())}"></div>
      <div><label>Hora</label><input id="tTime" type="time" value="${t?.time || ''}"></div>
    </div>
    <div class="form-row form-grid-2">
      <div><label>Categoria</label><select id="tCat">${catOptions}</select></div>
      <div><label>Recorrência</label><select id="tRec">
        <option value="none" ${rec==='none'?'selected':''}>Não repete</option>
        <option value="daily" ${rec==='daily'?'selected':''}>Todo dia</option>
        <option value="weekdays" ${rec==='weekdays'?'selected':''}>Dias úteis</option>
        <option value="weekly" ${rec==='weekly'?'selected':''}>Semanal</option>
        <option value="monthly" ${rec==='monthly'?'selected':''}>Mensal</option>
      </select></div>
    </div>
    <div><label>Observações</label><textarea id="tNotes" rows="3" placeholder="Opcional">${escapeHtml(t?.notes || '')}</textarea></div>
  `;
  const actions = `
    ${t ? '<button class="btn btn-danger" id="tDel">Excluir</button>' : ''}
    <button class="btn" data-close>Cancelar</button>
    <button class="btn btn-primary" id="tSave">Salvar</button>`;
  const m = openModal(t ? 'Editar tarefa' : 'Nova tarefa', body, actions);
  m.querySelector('#tSave').onclick = () => {
    const name = m.querySelector('#tName').value.trim();
    if (!name) return toast('Nome é obrigatório');
    const obj = {
      id: t?.id || nextId(),
      name,
      date: m.querySelector('#tDate').value,
      time: m.querySelector('#tTime').value || null,
      cat: m.querySelector('#tCat').value,
      recurrence: m.querySelector('#tRec').value,
      notes: m.querySelector('#tNotes').value.trim() || null,
      done: t?.done || false,
      doneDates: t?.doneDates || [],
      subtasks: t?.subtasks || [],
    };
    if (t) Object.assign(t, obj);
    else data.tasks.push(obj);
    saveData(); closeModal(); renderPage();
  };
  if (t) m.querySelector('#tDel').onclick = async () => {
    if (await askConfirm('Excluir esta tarefa?')) {
      data.tasks = data.tasks.filter(x => x.id !== t.id);
      saveData(); closeModal(); renderPage();
    }
  };
}

    .filter(t => t.date.startsWith(ym))

      <div class="tile"><div class="tile-label">Saldo</div><div class="tile-value ${totals.net>=0?'pos':'neg'}">${money(totals.net)}</div></div>
      <div class="tile"><div class="tile-label">Lançamentos</div><div class="tile-value">${totals.count}</div></div>

function txRow(t) {
  const sign = t.type === 'income' ? '+' : '−';
  const cls = t.type === 'income' ? 'pos' : 'neg';
  const d = parseDate(t.date);
  return `
    <div class="list-item" data-tx-edit="${t.id}">
      <div class="cat-dot" style="background:${catColor(t.cat)}"></div>
      <div class="list-item-main">
        <div class="list-item-name ellip">${escapeHtml(t.name)}</div>
        <div class="list-item-sub">
          <span>${d.getDate()}/${String(d.getMonth()+1).padStart(2,'0')}</span>
          <span>${escapeHtml(t.cat || 'Outros')}${t.subcat ? ' · ' + escapeHtml(t.subcat) : ''}</span>
        </div>
      </div>
      <div class="list-item-amount ${cls}">${sign} ${money(t.amount).replace('R$ ', '')}</div>
    </div>`;
}

function renderCatBars(ym) {
  const el = document.getElementById('catBars');
  if (!el) return;
  const txs = data.transactions.filter(t => t.date.startsWith(ym) && t.type === 'expense');
  const totals = {};
  for (const t of txs) {
    const key = t.cat || 'Outros';
    totals[key] = (totals[key] || 0) + Number(t.amount || 0);
  }
  const incomes = data.transactions.filter(t => t.date.startsWith(ym) && t.type === 'income');
  for (const t of incomes) {
    if (totals[t.cat]) totals[t.cat] = Math.max(0, totals[t.cat] - Number(t.amount||0));
  }
  const arr = Object.entries(totals).sort((a,b) => b[1] - a[1]);
  const total = arr.reduce((s,[,v]) => s+v, 0);
  if (!arr.length) { el.innerHTML = '<div class="empty" style="padding:20px">Sem despesas no mês.</div>'; return; }

  el.innerHTML = `
    <div class="cat-split">
      <div class="cat-donut-wrap">
        <canvas id="catDonut"></canvas>
        <div class="cat-donut-center">
          <div class="cat-donut-label">Total</div>
          <div class="cat-donut-value">${money(total)}</div>
        </div>
      </div>
      <div class="cat-bars">
        ${arr.map(([cat, v]) => {
          const pct = total > 0 ? Math.round(v/total*100) : 0;
          return `<div class="cat-bar-row">
            <div style="display:flex;align-items:center;gap:8px;min-width:0">
              <span class="cat-dot" style="background:${catColor(cat)};color:${catColor(cat)}"></span>
              <span class="ellip">${escapeHtml(cat)}</span>
            </div>
            <div style="font-family:var(--font-mono);font-size:13px;text-align:right">${money(v)}</div>
            <div style="text-align:right;color:var(--text-muted);font-size:12px">${pct}%</div>
            <div class="cat-bar-track" style="grid-column:1/-1"><div class="cat-bar-fill" style="width:${pct}%;background:${catColor(cat)}"></div></div>
          </div>`;
        }).join('')}
      </div>
    </div>
  `;

  const canvas = document.getElementById('catDonut');
  if (canvas && window.Chart) {
    const styles = getComputedStyle(document.documentElement);
    const textColor = styles.getPropertyValue('--text-muted').trim();
    const onyx = styles.getPropertyValue('--onyx').trim() || '#121214';
    charts.donut = new Chart(canvas, {
      type: 'doughnut',
      data: {
        labels: arr.map(([c]) => c),
        datasets: [{
          data: arr.map(([,v]) => v),

function renderEvolChart() {
  const canvas = document.getElementById('chartEvol');
  if (!canvas || !window.Chart) return;
  // Last 6 months including the viewed month
  const [y,m] = financeMonth.split('-').map(Number);
  const months = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(y, m-1-i, 1);
    months.push(ymKey(d));
  }
  const inc = months.map(ym => monthTotals(ym).inc);
  const exp = months.map(ym => monthTotals(ym).exp);
  const net = months.map(ym => monthTotals(ym).net);
  const labels = months.map(monthShort);
  const styles = getComputedStyle(document.documentElement);
  const textColor = styles.getPropertyValue('--text-muted').trim();
  const gridColor = styles.getPropertyValue('--border').trim();
  const posColor = styles.getPropertyValue('--success').trim();
  const negColor = styles.getPropertyValue('--danger').trim();
  const accColor = styles.getPropertyValue('--accent').trim();

  charts.evol = new Chart(canvas, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label: 'Receita', data: inc, backgroundColor: posColor, borderRadius: 4 },
        { label: 'Despesa', data: exp, backgroundColor: negColor, borderRadius: 4 },
        { label: 'Saldo', data: net, type: 'line', borderColor: accColor, backgroundColor: accColor, tension: 0.3, pointRadius: 3 },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { labels: { color: textColor, font: { size: 11 }, boxWidth: 10 } },
        tooltip: { callbacks: { label: ctx => ctx.dataset.label + ': ' + money(ctx.parsed.y) } }
      },
      scales: {
        x: { ticks: { color: textColor }, grid: { color: gridColor } },
        y: { ticks: { color: textColor, callback: v => 'R$' + (v>=1000?Math.round(v/1000)+'k':v) }, grid: { color: gridColor } },
      }

}

function getCardInvoiceTotal(cardId, ym) {
  return (data.cardTx || []).filter(t => t.cardId === cardId && invoiceMonthMatches(t, ym))
    .reduce((s,t) => s + perInstallment(t), 0);
}
function invoiceMonthMatches(tx, ym) {
  // simple: use date month unless installments
  const base = tx.date.slice(0,7);
  if (base > ym) return false;
  const start = parseDate(tx.date);
  const diff = monthDiff(start, parseDate(ym + '-01'));
  return diff >= 0 && diff < (tx.installmentsTotal || 1);
}
function perInstallment(tx) {
  const total = Number(tx.amount||0);
  const n = tx.installmentsTotal || 1;
  return n > 1 ? total / n : total;
}
function monthDiff(a, b) {
  return (b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth());
}
function shade(hex, pct) {
  const n = parseInt(hex.replace('#',''), 16);
  let r = (n>>16)&255, g = (n>>8)&255, b = n&255;
  r = Math.max(0, Math.min(255, r + Math.round(r*pct/100)));
  g = Math.max(0, Math.min(255, g + Math.round(g*pct/100)));
  b = Math.max(0, Math.min(255, b + Math.round(b*pct/100)));
  return '#' + ((1<<24) + (r<<16) + (g<<8) + b).toString(16).slice(1);
}

function payCardInvoice(cardId, ym) {
  const c = data.cards.find(x => x.id === cardId);

  if (c.paidInvoices.includes(ym)) {

function handleFile(file) {
  const r = new FileReader();
  r.onload = () => {
    const text = r.result;
    const nameLower = file.name.toLowerCase();
    if (nameLower.endsWith('.json') || text.trim().startsWith('{')) {
      restoreBackupText(text);
    } else if (nameLower.endsWith('.ofx') || text.includes('<OFX>') || text.includes('<STMTTRN>')) {
      previewTxs(parseOFX(text), 'OFX');
    } else {
      previewTxs(parseCSV(text), 'CSV');
    }
  };
  r.readAsText(file, 'utf-8');
}

function parseCSV(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if (!lines.length) return [];
  // detect delimiter
  const first = lines[0];
  const delim = (first.match(/;/g)||[]).length > (first.match(/,/g)||[]).length ? ';' : ',';
  const headerLikely = /data|date|descr|hist|valor|amount/i.test(first);
  const rows = (headerLikely ? lines.slice(1) : lines).map(l => splitCSV(l, delim));
  const txs = [];
  for (const r of rows) {
    if (r.length < 2) continue;
    // try: [date, desc, amount] or [date, amount, desc]
    let date, desc, amount;
    for (const cell of r) {
      if (!date) {
        const d = parseLooseDate(cell);
        if (d) { date = ymdKey(d); continue; }
      }
      if (amount === undefined) {
        const n = parseBRLNumber(cell);
        if (!isNaN(n) && /\d/.test(cell)) { amount = n; continue; }
      }
      if (!desc && cell.trim()) desc = cell.trim();
    }
    if (!date || amount === undefined || amount === 0) continue;
    const type = amount < 0 ? 'expense' : 'income';
    txs.push({
      _preview: true,
      name: desc || 'Importado',
      amount: Math.abs(amount),
      type,
      date,
      cat: guessCategory(desc || '', type),
    });
  }
  return txs;
}

function splitCSV(line, delim) {
  const out = []; let cur = ''; let q = false;
  for (const ch of line) {
    if (ch === '"') { q = !q; continue; }
    if (ch === delim && !q) { out.push(cur); cur = ''; continue; }
    cur += ch;
  }
  out.push(cur);
  return out.map(c => c.trim());
}

function parseLooseDate(s) {
  s = s.trim();
  // dd/mm/yyyy or dd/mm/yy
  let m = s.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2,4})$/);
  if (m) {
    let [,d,mo,y] = m;
    y = y.length === 2 ? ('20'+y) : y;
    const dt = new Date(+y, +mo-1, +d);
    if (dt.getFullYear() == y) return dt;
  }
  // yyyy-mm-dd
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (m) return new Date(+m[1], +m[2]-1, +m[3]);
  return null;
}

function parseBRLNumber(s) {
  if (!s) return NaN;
  s = String(s).trim().replace(/[R$\s]/g, '');
  if (!s) return NaN;
  // "1.234,56" or "1234,56" or "-1,234.56" or "1234.56"
  const hasComma = s.includes(',');
  const hasDot = s.includes('.');
  if (hasComma && hasDot) {
    // last separator is decimal
    const lastC = s.lastIndexOf(',');
    const lastD = s.lastIndexOf('.');
    if (lastC > lastD) s = s.replace(/\./g,'').replace(',','.');
    else s = s.replace(/,/g,'');
  } else if (hasComma) {
    s = s.replace(/\./g,'').replace(',','.');
  }
  return parseFloat(s);
}

function parseOFX(text) {
  const txs = [];
  const re = /<STMTTRN>([\s\S]*?)<\/STMTTRN>/gi;
  let m;
  while ((m = re.exec(text))) {
    const block = m[1];
    const type = /<TRNTYPE>([^<\r\n]+)/i.exec(block)?.[1]?.trim();
    const date = /<DTPOSTED>([^<\r\n]+)/i.exec(block)?.[1]?.trim();
    const amount = /<TRNAMT>([^<\r\n]+)/i.exec(block)?.[1]?.trim();
    const memo = /<MEMO>([^<\r\n]+)/i.exec(block)?.[1]?.trim()
             || /<NAME>([^<\r\n]+)/i.exec(block)?.[1]?.trim() || '';
    if (!date || !amount) continue;
    const d = date.slice(0,8);
    const yd = `${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}`;
    const n = parseFloat(amount);
    const txType = n < 0 ? 'expense' : 'income';
    txs.push({
      _preview: true,
      name: memo || 'Importado',
      amount: Math.abs(n),
      type: txType,
      date: yd,
      cat: guessCategory(memo, txType),
    });
  }
  return txs;
}

function guessCategory(desc, type) {
  const d = normalizeName(desc);
  if (type === 'income') {
    if (/salario|folha/.test(d)) return 'Salário';
    if (/rendimento|juros|dividendo|investimento|aplicac/.test(d)) return 'Investimentos';
    if (/reembolso|estorno|devolucao|cashback/.test(d)) return 'Reembolso';
    if (/presente|gift|aniversar/.test(d)) return 'Presente';
    if (/freelance|projeto|servico/.test(d)) return 'Projeto extra';
    if (/empresa|cnpj|razao social/.test(d)) return 'Empresa';
    return 'Outros';
  }
  // expense
  if (/mercado|super|pao|padaria|hortifruti|feira|ifood|rappi|uber eats/.test(d)) return 'Alimentação';
  if (/uber|99|taxi|combust|gasolin|posto|metro|onibus|estacion/.test(d)) return 'Transporte';
  if (/aluguel|condominio|luz|energia|agua|gas|internet|net |vivo|claro|tim/.test(d)) return 'Moradia';
  if (/farma|droga|hospital|medic|dentista|consulta/.test(d)) return 'Saúde';
  if (/escola|curso|faculdade|livro|udemy/.test(d)) return 'Educação';
  if (/cinema|netflix|spotify|hbo|disney|show|bar |restaur/.test(d)) return 'Lazer';
  if (/fatura|cartao/.test(d)) return 'Cartão';
  if (/emprestimo|financiamento/.test(d)) return 'Empréstimo';
  return 'Outros';
}
